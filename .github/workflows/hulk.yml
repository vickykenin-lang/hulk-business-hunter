name: HULK Business Hunter
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hulk-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Soul hard gate
        run: python scripts/soul_runtime.py
      - name: Serper adapter tests
        run: python -m unittest discover -s tests -v
      - name: Research readiness cycle
        env:
          AWS_BEDROCK_API_KEY: ${{ secrets.AWS_BEDROCK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPER_API_KEY_HULK: ${{ secrets.SERPER_API_KEY_HULK }}
        run: python scripts/research_cycle.py
      - name: Persist runtime state
        if: always()
        run: |
          git config user.name "HULK"
          git config user.email "hulk@business-hunter.local"
          git add data
          (git diff --cached --quiet || git commit -m "heartbeat: HULK runtime state")
          git pull --rebase --autostash
          git push
